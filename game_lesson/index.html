<html>
  <script>
    const MS_PER_UPDATE = 62.5
    const MAX_GUN_COUNT = 2
    class CanvasHandler {
      objects = []
      previousTime = 0

      constructor(canvas) {
        this.canvas = canvas
        this.ctx = canvas.getContext('2d')
        window.addEventListener('keydown', this.onKeyDown)
        this.canvas.addEventListener('mousemove', this.onMouseMove)
        this.canvas.addEventListener('mousedown', this.onMouseDown)
        this.previsousTime = Date.now()
      }

      onKeyDown = (e) => {
        // プレイヤーの戦車の操作
        const player = this.objects.find(obj => obj instanceof Player)
        if (e.code == 'ArrowDown') {
          player.posY += 5
        } if (e.code == 'ArrowUp') {
          player.posY -= 5
        } if (e.code == 'ArrowLeft') {
          player.posX -= 5
        } if (e.code == 'ArrowRight') {
          player.posX += 5
        }
      }

      onMouseDown = (e) => {
        const bullets = this.objects.filter(obj => obj instanceof Bullet)
        console.log(bullets.length)
        if (bullets.length >= MAX_GUN_COUNT) {
          return
        }
        const player = this.objects.find(obj => obj instanceof Player)
        const bullet = new Bullet({
          posX: player.getGunOutPosition().x,
          posY: player.getGunOutPosition().y,    
          angle: player.gunAngle,
          shooter: 'player'
        })
        this.addObject(bullet)
      }

      onMouseMove = (e) => {
        const rect = this.canvas.getBoundingClientRect()
        const mouseX = e.clientX - rect.left
        const mouseY = e.clientY - rect.top
        const player = this.objects.find(obj => obj instanceof Player)
        player.changeGunDirection(
          {
            x: mouseX - player.gunAxis.x,
            y: mouseY - player.gunAxis.y
          }
        )
      }

      addObject(obj) {
        this.objects.push(obj)
      }

      play = () => {
        const loop = () => {
          const currentTime = Date.now()
          let deltaTime = currentTime - this.previsousTime
          if (deltaTime < MS_PER_UPDATE) {
            requestAnimationFrame(loop)
            return
          } else {
            while (deltaTime >= MS_PER_UPDATE) {
              this.update()
              deltaTime -= MS_PER_UPDATE
            }
          }
          this.previsousTime = currentTime - deltaTime
          this.draw()
          requestAnimationFrame(loop)
        }
        requestAnimationFrame(loop)
      }

      update() {
        this.objects = this.objects.filter(obj => {
          if (obj instanceof Bullet) {
            if (obj.posX < 0 || obj.posX > this.canvas.width ||
                obj.posY < 0 || obj.posY > this.canvas.height) {
              return false
            }
          }
          return true
        })

        this.objects.forEach(obj => {
          obj.update()
        })
      }

      draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height)
        this.objects.forEach(obj => {
          obj.draw(this.ctx)
        })
      }
    }

    class GameObject {
      posX = 0
      posY = 0
      velX = 0
      velY = 0
      angle = 0

      constructor({
        posX,
        posY,
        velX,
        velY,
        angle
      }) {
        this.posX = posX
        this.posY = posY
        this.velX = velX || 0
        this.velY = velY || 0
        this.angle = angle || 0
        this.id = Math.random().toString(36).substring(2, 15)
      }

      update() {
        this.posX += this.velX
        this.posY += this.velY
      }

      draw(ctx) {}
    }

    class Bullet extends GameObject {
      color = 'black'
      shooter = 'player' | 'enemy'
      id = null

      constructor({
        posX,
        posY,
        angle,
        velX,
        velY,
        shooter
      }) {
        super({
          posX,
          posY,
          velX: 20  * Math.cos(angle) + (velX || 0),
          velY: 20 * Math.sin(angle) + (velY || 0),
          angle
        })
        this.shooter = shooter
      }

      draw(ctx) {
        ctx.fillStyle = this.color
        ctx.beginPath()
        ctx.arc(this.posX, this.posY, 5, 0, 2 * Math.PI)
        ctx.fill()
      }
    }

    const TANK_WIDTH = 30
    const TANK_HEIGHT = 30
    const GUN_WIDTH = 6
    const GUN_LENGTH = 20

    class Tank extends GameObject {
      color = 'green'
      width = TANK_WIDTH
      height = TANK_HEIGHT
      type = 'player' | 'enemy' | null

      gunWidth = GUN_WIDTH
      gunLength = GUN_LENGTH
      gunDirectionX = 0
      gunDirectionY = 0

      constructor({
        posX,
        posY,
        angle = 0
      }) {
        super({posX, posY, angle})
      }

      setColor (color) {
        this.color = color
      }

      get gunAxis() {
        return {
          x: this.width / 2 + this.posX,
          y: this.height / 2 + this.posY
        }
      }

      get gunAngle() {
        return Math.atan2(this.gunDirectionY, this.gunDirectionX)
      }

      draw(ctx) {
        ctx.fillStyle = this.color
        ctx.strokeStyle = 'black'
        ctx.lineWidth = 2
        ctx.beginPath()
        
        ctx.fillRect(this.posX, this.posY, this.width, this.height)
        
        const g0 = this.gunAxis
        const angle = this.gunAngle
        const g1 = {
          x: g0.x - this.gunWidth / 2 * Math.sin(angle),
          y: g0.y + this.gunWidth / 2 * Math.cos(angle)
        }
        ctx.moveTo(g1.x, g1.y)
        const g2 = {
          x: g1.x + this.gunLength * Math.cos(angle),
          y: g1.y + this.gunLength * Math.sin(angle)
        }
        ctx.lineTo(g2.x, g2.y)
        const g3 = {
          x: g2.x + this.gunWidth * Math.sin(angle),
          y: g2.y - this.gunWidth * Math.cos(angle)
        }
        ctx.lineTo(g3.x, g3.y)
        const g4 = {
          x: g3.x - this.gunLength * Math.cos(angle),
          y: g3.y - this.gunLength * Math.sin(angle)
        }
        ctx.lineTo(g4.x, g4.y)
        ctx.closePath()
        ctx.stroke()
        ctx.fill()
      }

      // 砲台の向きを変更する
      changeGunDirection({ x, y }) {
        this.gunDirectionX = x
        this.gunDirectionY = y
      }

      getGunOutPosition() {
        return {
          x: this.width / 2 + this.posX + this.gunLength * Math.cos(this.gunAngle),
          y: this.height / 2 + this.posY + this.gunLength * Math.sin(this.gunAngle)
        }
      }
    }

    class Player extends Tank {
      constructor(posX, posY) {
        super({posX, posY, angle: Math.PI * 1 / 4} )
        this.color = 'blue'
        this.type = 'player'
      }

      draw(ctx) {
        super.draw(ctx)
      }
    }

    class Enemy extends Tank {
      constructor(posX, posY) {
        super({posX, posY} )
        this.color = 'gray'
        this.type = 'enemy'
      }

      draw = (ctx) => {
        super.draw(ctx)
      }
    }

    class Stage extends GameObject {
      width = 0
      height = 0

      constructor({
        width,
        height
      }) {
        super({posX: 0, posY: 0})
        this.width = width
        this.height = height
      }

      draw(ctx) {
        ctx.strokeStyle = 'rgb(0, 0, 0)'
        ctx.strokeRect(this.posX, this.posY, this.width, this.height)
      }
    }

    function init() {
      const canvas = document.getElementById('canvas')
      const ctx = canvas.getContext('2d')
      canvas.width = 800
      canvas.height = 600

      const canvasHandler = new CanvasHandler(canvas)
      const stage = new Stage({
        x: 0,
        y: 0,
        width: canvas.width,
        height: canvas.height
      })
      canvasHandler.addObject(stage)

      const player = new Player(50, 50)
      canvasHandler.addObject(player)

      const enemy = new Enemy(400, 400)
      canvasHandler.addObject(enemy)

      canvasHandler.play()
    }
      
  </script>
  <body onload="init()">
    <canvas id="canvas" />
  </body>
</html>
